[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "exhash"
dynamic = ["version"]
description = "Verified line-addressed file editor using lnhash addresses"
license = {text = "MIT OR Apache-2.0"}
requires-python = ">=3.10"
readme = "README.md"
authors = [{name = "Jeremy Howard", email = "j@fast.ai"}]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = ["fastcore>=1.14.6", "httpx>=0.28.1"]

[project.optional-dependencies]
dev = ["fastship>=0.0.11", "maturin>=1.0,<2.0", "pytest"]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/exhash"
Repository = "https://github.com/AnswerDotAI/exhash"
Issues = "https://github.com/AnswerDotAI/exhash/issues"
[project.scripts]
exhash = "exhash._cli:exhash_main"
lnhashview = "exhash._cli:lnhashview_main"

[project.entry-points.pyskills]
exhash = "exhash.skill"

[project.entry-points.fastaudit_safe_native]
exhash = "exhash"

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "exhash.exhash"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = ".git/fastws-cargo-key" }]

[tool.pytest.ini_options]
markers = ["slow: live-network tests, run explicitly with -m slow"]
addopts = "-m 'not slow'"

[tool.fastship]
branch = "main"
