[workspace]
members = ["py"]
default-members = [".", "py"]

[workspace.package]
version = "0.4.19"
edition = "2024"

[package]
name = "exhash"
version.workspace = true
edition.workspace = true
rust-version = "1.91"
license = "Apache-2.0"
description = "Verified line-addressed file editor using lnhash addresses"
repository = "https://github.com/AnswerDotAI/exhash"
homepage = "https://github.com/AnswerDotAI/exhash"
documentation = "https://github.com/AnswerDotAI/exhash"

[lib]
name = "exhash"

[dependencies]
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tempfile = "3"
regex = "1.7.1"
fancy-regex = "0.19.2"
tree-sitter = "0.26.12"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-rust = "0.24.2"
tree-sitter-zig = "1.1.2"
tree-sitter-swift = "0.7.3"

[lints.clippy]
too_many_arguments = "allow"

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.exhash]
incremental = true

[profile.release.package.exhash-py]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.exhash]
incremental = false

[profile.dist.package.exhash-py]
incremental = false
